name: Build OpenWrt package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare OpenWrt package feed
        shell: bash
        run: |
          feed_dir="${RUNNER_TEMP}/nanopi-control-feed/luci-app-nanopi-control"
          mkdir -p "${feed_dir}"
          cp -a Makefile LICENSE htdocs po root "${feed_dir}/"

      - name: Build with the official OpenWrt SDK action
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: aarch64_generic-25.12.5
          FEED_DIR: ${{ runner.temp }}/nanopi-control-feed
          PACKAGES: luci-app-nanopi-control
          BUILD_LOG: 1
          V: s

      - name: Prepare stable release filenames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          app="$(find bin/packages -type f -name 'luci-app-nanopi-control*.apk' | head -n 1)"
          i18n="$(find bin/packages -type f -name 'luci-i18n-nanopi-control-ru*.apk' | head -n 1)"
          test -n "$app" && test -n "$i18n"
          cp "$app" release/luci-app-nanopi-control.apk
          cp "$i18n" release/luci-i18n-nanopi-control-ru.apk
          (cd release && sha256sum *.apk > SHA256SUMS)

      - name: Upload packages and build logs
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-nanopi-control-openwrt-25.12.5
          path: |
            release/*
            logs/**
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "NanoPi Control ${GITHUB_REF_NAME}" \
            --generate-notes
