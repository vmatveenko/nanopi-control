name: Build OpenWrt package

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build with the official OpenWrt SDK action
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: aarch64_generic-25.12.5
          PACKAGES: luci-app-nanopi-control
          BUILD_LOG: 1
          V: s

      - name: Upload packages and build logs
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-nanopi-control-openwrt-25.12.5
          path: |
            bin/packages/**/*.apk
            bin/packages/**/*.ipk
            logs/**
          if-no-files-found: error

